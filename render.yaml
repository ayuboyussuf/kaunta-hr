services:
  # ── Web service (Express API) ──────────────────────────────────────────────
  - type: web
    name: kaunta-hr
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      # Set every secret below in the Render dashboard — do not commit them.
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: QR_TOKEN_SECRET
        sync: false
      - key: EMPLOYEE_JWT_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
      # Leave unset to run the scheduler in this service (the default). Set to
      # "false" only if something outside Render drives /api/cron/* instead —
      # running both would fire every job twice.
      - key: RUN_SCHEDULER
        sync: false

# ── On the schedule ──────────────────────────────────────────────────────────
#
# There were five `type: cron` services here. They never ran: Render's cron is
# a paid service type, so on this plan the blocks were accepted and silently
# did nothing — which is how random presence checks went two days without
# firing and nothing anywhere said so.
#
# The schedule now lives in the app (backend/src/lib/scheduler). It deploys
# with the code that defines it, costs nothing, and a job that stops running
# shows up in the same logs as everything else.
#
# One caveat worth knowing about the free web plan: it sleeps after ~15 minutes
# of no traffic, and a sleeping service runs no schedule. The five-minute
# presence tick is itself traffic and keeps it awake, so in practice the jobs
# run — but if this is ever moved to a plan or platform that hard-sleeps, set
# RUN_SCHEDULER=false and drive /api/cron/* from outside with CRON_SECRET.
